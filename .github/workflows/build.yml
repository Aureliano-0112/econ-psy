name: build

# 门禁全绿才部署（AGENTS.md 第 6 节）；无 continue-on-error，任一失败即阻塞。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1. 构建（data.js + 预渲染 + sitemap + llms.txt）
        run: node site/build.js

      - name: 2. 计数对账 README/ROADMAP
        run: node site/build.js --check

      - name: 3. 结构审计 L001–L010
        run: python3 scripts/audit_lessons.py --strict

      - name: 4. 覆盖率报表（不阻塞）
        run: python3 scripts/audit_lessons.py --report > coverage.md

      - name: 5. quiz 去偏与作答前防泄漏
        run: node site/test_quiz_debias.js

      - name: 6. 进度 schemaVersion 迁移
        run: node site/test_progress.js

      - name: 7. 预渲染路由可直达
        run: node site/test_seo_routes.js

      - name: 上传站点产物
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4